<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de chats</title>
  </head>

  <body>
    <script id="chat-template" type="text/x-handlebars-template">
      <div class="chat-item">
        <div class="chat-item__block chat-item__block--current">
          <div class="chat-item__avatar">avatar.jpg</div>
          <div class="chat-item__name">
            Welcome Chat
            <time
              class="chat-item__date"
              datetime="2025-02-15T09:20+06:00"
            >2026-02-15T09:20+06:00</time>
          </div>
          <div class="chat-item__message">
            <span class="chat-item__message-text">Hola!</span>
          </div>
        </div>
      </div>
    </script>

    <script src="./src/index.js" type="module"></script>
  </body>
</html>
